<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTA 6 launch night queue — make.fun meme</title>
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 1024px; background: #0a0a10; }
  svg { display: block; }
  .cap  { font-family: 'Liberation Sans', 'Arial Black', Arial, sans-serif; font-weight: 900; }
  .bold { font-family: 'Liberation Sans', Arial, sans-serif; font-weight: 800; }
</style>
</head>
<body>
<svg width="1280" height="1024" viewBox="0 0 1280 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0640"/>
      <stop offset="0.35" stop-color="#5b1160"/>
      <stop offset="0.62" stop-color="#c22a5c"/>
      <stop offset="0.82" stop-color="#f26430"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff7b39"/>
    </linearGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff2e88" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="150" cy="80" r="2.5"/><circle cx="320" cy="150" r="2"/><circle cx="520" cy="70" r="2.5"/>
    <circle cx="700" cy="120" r="2"/><circle cx="880" cy="60" r="2.5"/><circle cx="1080" cy="140" r="2"/>
    <circle cx="1180" cy="80" r="2"/><circle cx="240" cy="230" r="2"/><circle cx="980" cy="210" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="760" cy="180" r="1.8"/><circle cx="430" cy="190" r="1.8"/>
    <circle cx="1150" cy="250" r="1.8"/><circle cx="180" cy="320" r="1.6"/><circle cx="1050" cy="300" r="1.6"/>
  </g>
  <path d="M210,108 L212.6,117.4 L222,120 L212.6,122.6 L210,132 L207.4,122.6 L198,120 L207.4,117.4 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M1090,80 L1092.2,87.8 L1100,90 L1092.2,92.2 L1090,100 L1087.8,92.2 L1080,90 L1087.8,87.8 Z" fill="#ffffff" opacity="0.9"/>

  <!-- retro sun, low on the horizon -->
  <circle cx="1055" cy="615" r="165" fill="url(#sun)"/>
  <g fill="#b01e56" opacity="0.8">
    <rect x="890" y="638" width="330" height="9"/>
    <rect x="890" y="664" width="330" height="13"/>
    <rect x="890" y="694" width="330" height="17"/>
  </g>

  <!-- Leonida skyline silhouette -->
  <g fill="#20093d">
    <rect x="0" y="520" width="90" height="180"/><rect x="85" y="470" width="70" height="230"/>
    <rect x="150" y="545" width="110" height="155"/><rect x="255" y="495" width="80" height="205"/>
    <rect x="330" y="555" width="95" height="145"/><rect x="420" y="480" width="75" height="220"/>
    <rect x="490" y="540" width="105" height="160"/><rect x="590" y="500" width="85" height="200"/>
    <rect x="670" y="550" width="100" height="150"/><rect x="765" y="485" width="70" height="215"/>
    <rect x="830" y="535" width="95" height="165"/><rect x="920" y="475" width="80" height="225"/>
    <rect x="995" y="545" width="110" height="155"/><rect x="1100" y="505" width="75" height="195"/>
    <rect x="1170" y="555" width="110" height="145"/>
    <rect x="118" y="436" width="4" height="34"/>
  </g>
  <circle cx="120" cy="432" r="4" fill="#ff2e88"/>
  <g fill="#ffd23f" opacity="0.75">
    <rect x="100" y="500" width="8" height="11"/><rect x="128" y="540" width="8" height="11"/>
    <rect x="275" y="530" width="8" height="11"/><rect x="440" y="520" width="8" height="11"/>
    <rect x="612" y="545" width="8" height="11"/><rect x="782" y="520" width="8" height="11"/>
    <rect x="940" y="510" width="8" height="11"/><rect x="1120" y="545" width="8" height="11"/>
    <rect x="30" y="560" width="8" height="11"/><rect x="700" y="585" width="8" height="11"/>
    <rect x="860" y="570" width="8" height="11"/><rect x="1020" y="580" width="8" height="11"/>
  </g>

  <!-- palm trees -->
  <g stroke="#150826" fill="none" stroke-linecap="round">
    <path d="M98,690 Q84,480 72,296" stroke-width="17"/>
    <path d="M72,296 Q30,252 2,292" stroke-width="11"/>
    <path d="M72,296 Q60,238 18,214" stroke-width="11"/>
    <path d="M72,296 Q96,232 140,208" stroke-width="11"/>
    <path d="M72,296 Q128,252 168,262" stroke-width="11"/>
    <path d="M72,296 Q120,286 172,318" stroke-width="11"/>
    <path d="M72,296 Q40,282 -6,318" stroke-width="11"/>
    <path d="M1182,690 Q1196,500 1208,316" stroke-width="17"/>
    <path d="M1208,316 Q1250,272 1278,292" stroke-width="11"/>
    <path d="M1208,316 Q1220,258 1262,234" stroke-width="11"/>
    <path d="M1208,316 Q1184,252 1140,228" stroke-width="11"/>
    <path d="M1208,316 Q1152,272 1112,282" stroke-width="11"/>
    <path d="M1208,316 Q1160,306 1108,338" stroke-width="11"/>
  </g>
  <circle cx="60" cy="306" r="9" fill="#150826"/><circle cx="86" cy="312" r="8" fill="#150826"/>
  <circle cx="1196" cy="326" r="9" fill="#150826"/><circle cx="1222" cy="332" r="8" fill="#150826"/>

  <!-- ground -->
  <rect x="0" y="680" width="1280" height="200" fill="#1e0f33"/>
  <rect x="0" y="680" width="1280" height="26" fill="#43235f"/>
  <rect x="0" y="706" width="1280" height="5" fill="#12081f"/>

  <!-- game store -->
  <g>
    <rect x="95" y="415" width="510" height="285" fill="#2a1650" stroke="#0d0518" stroke-width="4"/>
    <rect x="80" y="400" width="540" height="130" rx="14" fill="#12081f" stroke="#ff2e88" stroke-width="5" filter="url(#neon)"/>
    <text class="cap" x="350" y="502" text-anchor="middle" font-size="104" letter-spacing="4" fill="#ffd23f">GTA 6</text>
    <!-- awning, alternating stripes -->
    <g stroke="#0d0518" stroke-width="2">
      <polygon points="110,548 155,548 165.7,598 126,598" fill="#e0218a"/>
      <polygon points="155,548 200,548 205.3,598 165.7,598" fill="#fdf6ec"/>
      <polygon points="200,548 245,548 245,598 205.3,598" fill="#e0218a"/>
      <polygon points="245,548 290,548 284.7,598 245,598" fill="#fdf6ec"/>
      <polygon points="290,548 335,548 324.3,598 284.7,598" fill="#e0218a"/>
      <polygon points="335,548 380,548 364,598 324.3,598" fill="#fdf6ec"/>
    </g>
    <!-- OUT NOW pill -->
    <rect x="392" y="548" width="196" height="56" rx="28" fill="#e0218a" stroke="#0d0518" stroke-width="3"/>
    <text class="cap" x="490" y="589" text-anchor="middle" font-size="38" letter-spacing="2" fill="#ffffff">OUT NOW</text>
    <!-- windows -->
    <rect x="125" y="618" width="110" height="82" fill="#9fd8e8" opacity="0.85" stroke="#0d0518" stroke-width="4"/>
    <rect x="255" y="618" width="110" height="82" fill="#9fd8e8" opacity="0.85" stroke="#0d0518" stroke-width="4"/>
    <polygon points="140,700 195,618 225,618 170,700" fill="#ffffff" opacity="0.25"/>
    <!-- door with warm glow -->
    <rect x="444" y="610" width="112" height="90" fill="#ffdf9e" opacity="0.5"/>
    <rect x="452" y="618" width="96" height="82" fill="#ffca7a" stroke="#0d0518" stroke-width="4"/>
    <circle cx="536" cy="662" r="5" fill="#0d0518"/>
  </g>

  <!-- speech bubble (tail points down to the ghost) -->
  <path d="M613,268 H1107 A28,28 0 0 1 1135,296 V440 A28,28 0 0 1 1107,468 H795 L740,560 L692,468 H613 A28,28 0 0 1 585,440 V296 A28,28 0 0 1 613,268 Z"
        fill="#ffffff" stroke="#0d0d12" stroke-width="7" stroke-linejoin="round"/>
  <text class="bold" x="860" y="330" text-anchor="middle" font-size="50" fill="#14101f">I spent the wait</text>
  <text class="bold" x="860" y="385" text-anchor="middle" font-size="50" fill="#14101f">winning bounties</text>
  <text class="bold" x="860" y="440" text-anchor="middle" font-size="50" fill="#14101f">on <tspan fill="#d6006d">make.fun</tspan></text>

  <!-- queue shadow -->
  <ellipse cx="930" cy="852" rx="350" ry="13" fill="#000000" opacity="0.35"/>

  <!-- gamers waiting in line (silhouettes, seen from behind) -->
  <g>
    <!-- gamer 1, magenta cap -->
    <rect x="968" y="790" width="26" height="58" fill="#1d1136"/>
    <rect x="1010" y="790" width="26" height="58" fill="#1d1136"/>
    <rect x="958" y="636" width="88" height="168" rx="30" fill="#1d1136"/>
    <circle cx="1002" cy="596" r="38" fill="#1d1136"/>
    <path d="M964,592 A38,38 0 0 1 1040,592 Z" fill="#e0218a"/>
    <rect x="1036" y="586" width="34" height="11" rx="5" fill="#e0218a"/>
    <!-- gamer 2, backpack -->
    <rect x="1086" y="792" width="24" height="56" fill="#150b2a"/>
    <rect x="1130" y="792" width="24" height="56" fill="#150b2a"/>
    <rect x="1078" y="650" width="84" height="160" rx="34" fill="#150b2a"/>
    <rect x="1150" y="668" width="30" height="96" rx="12" fill="#2c1a52"/>
    <circle cx="1120" cy="612" r="36" fill="#150b2a"/>
    <!-- gamer 3, holding a game case -->
    <rect x="1188" y="794" width="22" height="54" fill="#241243"/>
    <rect x="1228" y="794" width="22" height="54" fill="#241243"/>
    <rect x="1180" y="662" width="80" height="150" rx="28" fill="#241243"/>
    <circle cx="1220" cy="626" r="34" fill="#241243"/>
    <rect x="1160" y="700" width="17" height="24" rx="2" fill="#f5f0e6"/>
  </g>

  <!-- the make.fun ghost, front of the queue, holding its magenta coin -->
  <g transform="translate(620,520)">
    <path d="M18,306 L18,120 A117,117 0 0 1 252,120 L252,306 A29.25,17 0 0 1 193.5,306 A29.25,17 0 0 1 135,306 A29.25,17 0 0 1 76.5,306 A29.25,17 0 0 1 18,306 Z"
          fill="#ffffff" stroke="#0d0d12" stroke-width="11" stroke-linejoin="round"/>
    <path d="M95,113 L100.9,134.1 L122,140 L100.9,145.9 L95,167 L89.1,145.9 L68,140 L89.1,134.1 Z" fill="#0d0d12"/>
    <path d="M175,113 L180.9,134.1 L202,140 L180.9,145.9 L175,167 L169.1,145.9 L148,140 L169.1,134.1 Z" fill="#0d0d12"/>
    <circle cx="250" cy="228" r="24" fill="#ffffff" stroke="#0d0d12" stroke-width="9"/>
    <circle cx="276" cy="252" r="46" fill="#e0218a" stroke="#0d0d12" stroke-width="8"/>
    <polygon points="272,224 277.6,240.2 294.8,240.6 281.1,251 286.1,267.4 272,257.6 257.9,267.4 262.9,251 249.2,240.6 266.4,240.2"
             fill="#ffffff" transform="translate(4,4)"/>
  </g>

  <!-- top caption -->
  <text class="cap" x="640" y="118" text-anchor="middle" font-size="100" letter-spacing="2"
        fill="#ffffff" stroke="#0d0518" stroke-width="10" paint-order="stroke">WAITED 13 YEARS</text>
  <text class="cap" x="640" y="232" text-anchor="middle" font-size="100" letter-spacing="2"
        fill="#ffffff" stroke="#0d0518" stroke-width="10" paint-order="stroke">FOR <tspan fill="#ffd23f">GTA 6</tspan></text>

  <!-- bottom bar -->
  <rect x="0" y="880" width="1280" height="144" fill="#0a0a10"/>
  <rect x="0" y="880" width="1280" height="5" fill="#e0218a"/>
  <text class="cap" x="640" y="982" text-anchor="middle" font-size="84" letter-spacing="2" fill="#ffffff">LAUNCH DAY. <tspan fill="#ffd23f">FINALLY.</tspan></text>
</svg>
</body>
</html>
